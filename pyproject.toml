[project]
name = "dubizzle-cars-assistant"
version = "0.1.0"
description = "Conservative, deterministic car inventory data layer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=1,<3",
    "httpx>=0.28.1",
    "openai>=3.11.0",
    "openpyxl>=3.1.5,<4",
    "streamlit>=1.63.0",
    "tzdata>=2026.3",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dubizzle_cars"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".tools", ".uv-cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
